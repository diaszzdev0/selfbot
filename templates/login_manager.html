<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Manager Login — SelfBot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #161b22; border: 1px solid #30363d; width: 100%; max-width: 400px; }
    .brand { font-size: 1.4rem; font-weight: 700; color: #f85149; }
  </style>
</head>
<body>
  <div class="card p-4 rounded-3 shadow-lg">
    <div class="text-center mb-4">
      <div class="brand">🛡️ Manager Panel</div>
      <small class="text-secondary">Acesso restrito</small>
    </div>
    {% if erro %}<div class="alert alert-danger py-2">{{ erro }}</div>{% endif %}
    <form method="POST" autocomplete="on">
      <div class="mb-3">
        <label class="form-label text-secondary small">Usuário</label>
        <input name="username" class="form-control bg-dark border-secondary text-white" autocomplete="username" value="{{ saved_user }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary small">Senha</label>
        <input name="password" type="password" class="form-control bg-dark border-secondary text-white" autocomplete="current-password" value="{{ saved_pass }}" required>
      </div>
      <div class="mb-3 d-flex align-items-center gap-2">
        <input type="checkbox" id="lembrar" name="lembrar" class="form-check-input m-0" {{ 'checked' if saved_user }}>
        <label for="lembrar" class="text-secondary small mb-0">Lembrar usuário e senha</label>
      </div>
      <button class="btn btn-danger w-100">Entrar</button>
    </form>
  </div>
</body>
</html>
