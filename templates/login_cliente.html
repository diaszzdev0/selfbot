<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VolueTech SelfBot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background: #0d1117; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
    .card { background: #161b22; border: 1px solid #30363d; width: 100%; max-width: 400px; }
    .brand { font-size: 1.4rem; font-weight: 700; color: #58a6ff; }
    .form-control { background: #0d1117 !important; border-color: #30363d !important; color: #c9d1d9 !important; font-size: 16px; }
    input { min-height: 44px; }
    button { min-height: 44px; }
  </style>
</head>
<body>
  <div class="card p-4 rounded-3 shadow-lg">
    <div class="text-center mb-4">
      <div class="brand">⚡ VolueTech SelfBot</div>
      <small class="text-secondary">Acesse sua conta</small>
    </div>
    {% if erro %}<div class="alert alert-danger py-2">{{ erro }}</div>{% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label text-secondary small">Usuário</label>
        <input name="username" class="form-control" value="{{ saved_user }}" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary small">Key</label>
        <input name="key" class="form-control font-monospace" placeholder="Ex: A3KX92BT" value="{{ saved_key }}" required>
      </div>
      <div class="mb-4 d-flex align-items-center gap-2">
        <input type="checkbox" id="lembrar" name="lembrar" class="form-check-input m-0" {{ 'checked' if saved_user }}>
        <label for="lembrar" class="text-secondary small mb-0">Lembrar usuário e key</label>
      </div>
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>
</body>
</html>
