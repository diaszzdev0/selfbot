<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cloud Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            slate: {
              950: '#020617',
              900: '#0F172A',
              850: '#0B1221',
              800: '#1E293B',
              750: '#162032',
              700: '#334155',
              600: '#475569',
              500: '#64748B',
              400: '#94A3B8',
              300: '#CBD5E1',
              200: '#E2E8F0',
              100: '#F1F5F9',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,0.35); }
    
    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.5);
    }
    
    .page {
      display: none;
      animation: fadeIn 0.25s ease-out;
    }
    .page.active { display: block; }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-dot { animation: pulse-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    
    .nav-item {
      transition: all 0.2s ease;
    }
    .nav-item:hover {
      background: rgba(59, 130, 246, 0.08);
    }
    .nav-item.active {
      background: rgba(59, 130, 246, 0.12);
      border-right: 3px solid #3B82F6;
    }
    
    .card-hover {
      transition: all 0.2s ease;
    }
    .card-hover:hover {
      border-color: rgba(71, 85, 105, 0.8);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
    }
    
    .btn-primary {
      background: #3B82F6;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: #2563EB;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
    }
    
    .input-field {
      transition: all 0.2s ease;
    }
    .input-field:focus {
      border-color: #3B82F6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    
    .modal-backdrop {
      background: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(4px);
    }
    
    .avatar {
      background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
    }
    .avatar-emerald {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
    }
    .avatar-amber {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
    }
    .avatar-rose {
      background: linear-gradient(135deg, #F43F5E 0%, #E11D48 100%);
    }
    
    @media (max-width: 1024px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0 !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen antialiased">

  <!-- Mobile Overlay -->
  <div id="overlay" class="fixed inset-0 z-40 hidden lg:hidden modal-backdrop" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar fixed top-0 left-0 h-screen w-64 glass z-50 flex flex-col border-r border-slate-800/50">
    <!-- Brand -->
    <div class="p-6 border-b border-slate-800/50">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/20">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
        <div>
          <div class="font-semibold text-white text-sm tracking-tight">Cloud Manager</div>
          <div class="text-xs text-slate-500">Admin Panel</div>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="px-4 py-4 space-y-2">
      <div class="bg-slate-900/80 rounded-lg p-3 border border-slate-800/60">
        <div class="text-2xl font-bold text-white">{{ users|length }}</div>
        <div class="text-xs text-slate-500 mt-0.5">Usuários cadastrados</div>
      </div>
      <div class="bg-slate-900/80 rounded-lg p-3 border border-slate-800/60">
        <div class="text-2xl font-bold text-emerald-400">{{ status.values()|select|list|length }}</div>
        <div class="text-xs text-slate-500 mt-0.5">Bots online</div>
      </div>
      <div class="bg-slate-900/80 rounded-lg p-3 border border-slate-800/60">
        <div class="text-2xl font-bold text-blue-400">{{ keys|selectattr('usado', 'equalto', false)|list|length }}</div>
        <div class="text-xs text-slate-500 mt-0.5">Keys disponíveis</div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-2 space-y-1 overflow-y-auto">
      <button class="nav-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-200" onclick="showPage('usuarios', this)">
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        Usuários
      </button>
      <button class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200" onclick="showPage('keys', this)">
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        Keys
      </button>
      <button class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200" onclick="showPage('bots', this)">
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
        Bots
      </button>
      <button class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200" onclick="showPage('salas', this)">
        <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"/></svg>
        Salas FF
      </button>
    </nav>

    <!-- Footer -->
    <div class="p-4 border-t border-slate-800/50">
      <a href="/logout" class="flex items-center justify-center gap-2 w-full px-4 py-2.5 rounded-lg border border-red-500/30 text-red-400 text-sm font-medium hover:bg-red-500/10 transition-all duration-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sair
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content lg:ml-64 min-h-screen">
    <!-- Topbar -->
    <header class="sticky top-0 z-30 glass border-b border-slate-800/50 px-4 lg:px-8 py-4">
      <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button class="lg:hidden p-2 rounded-lg border border-slate-700 text-slate-400 hover:text-white hover:border-slate-600 transition-colors" onclick="toggleSidebar()">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 id="page-title" class="text-lg font-semibold text-white">Usuários</h1>
        </div>
        <div class="flex items-center gap-3">
          <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse-dot"></span>
            Sistema operacional
          </div>
        </div>
      </div>
    </header>

    <!-- Content -->
    <div class="max-w-7xl mx-auto px-4 lg:px-8 py-6">

      <!-- ================================================================ -->
      <!-- PAGINA: USUARIOS -->
      <!-- ================================================================ -->
      <div class="page active" id="page-usuarios">
        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
          <!-- Left Column: Forms -->
          <div class="xl:col-span-1 space-y-6">
            <!-- Create User -->
            <div class="bg-slate-900 rounded-xl border border-slate-800 p-5 card-hover">
              <h2 class="text-white font-semibold text-sm mb-4 flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
                Criar Usuário
              </h2>
              {% if msg %}
              <div class="mb-4 px-3 py-2 rounded-lg text-sm {% if msg_tipo == 'danger' %}bg-red-500/10 text-red-400 border border-red-500/20{% else %}bg-emerald-500/10 text-emerald-400 border border-emerald-500/20{% endif %}">
                {{ msg }}
              </div>
              {% endif %}
              <form method="POST" action="/admin/criar_usuario" class="space-y-3">
                <div>
                  <label class="block text-xs text-slate-500 mb-1.5">Usuário</label>
                  <input name="username" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-sm text-white placeholder-slate-600 input-field focus:outline-none" placeholder="nome do cliente" required>
                </div>
                <div>
                  <label class="block text-xs text-slate-500 mb-1.5">Tipo de Licença</label>
                  <select name="tipo" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2.5 text-sm text-white input-field focus:outline-none">
                    <option value="semanal">Semanal (7 dias)</option>
                    <option value="mensal" selected>Mensal (30 dias)</option>
                    <option value="permanente">Permanente</option>
                  </select>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium py-2.5 rounded-lg transition-all duration-200 hover:shadow-lg hover:shadow-emerald-500/20">
                  + Criar Usuário
                </button>
              </form>
            </div>
