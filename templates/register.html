<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Registrar — SelfBot Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #0d1117; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #161b22; border: 1px solid #30363d; width: 100%; max-width: 420px; }
  </style>
</head>
<body>
  <div class="card p-4 rounded-3 shadow-lg">
    <div class="text-center mb-4">
      <div class="fs-5 fw-bold text-info">Criar Conta</div>
      <small class="text-secondary">Você precisa de uma key válida</small>
    </div>
    {% if erro %}<div class="alert alert-danger py-2">{{ erro }}</div>{% endif %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label text-secondary small">Usuário</label>
        <input name="username" class="form-control bg-dark border-secondary text-white" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary small">Senha</label>
        <input name="password" type="password" class="form-control bg-dark border-secondary text-white" required>
      </div>
      <div class="mb-3">
        <label class="form-label text-secondary small">License Key</label>
        <input name="key" class="form-control bg-dark border-secondary text-warning font-monospace" required>
      </div>
      <button class="btn btn-success w-100">Registrar</button>
    </form>
    <hr class="border-secondary">
    <a href="/" class="btn btn-outline-secondary w-100 btn-sm">Voltar ao Login</a>
  </div>
</body>
</html>
